<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head><body><canvas id="c" width="2400" height="1500"></canvas>
<script src="../../../engine/engine.js"></script><script src="../../../engine/engine3.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
window.draw = async () => {
  for (const [f, u, w] of [['Title', '../style-sampler/src/assets/title.woff2', 600]]) { try { document.fonts.add(await new FontFace(f, `url(${u})`, { weight: String(w) }).load()); } catch (e) {} }
  ctx.fillStyle = '#faf6ee'; ctx.fillRect(0, 0, 2400, 1500);
  ctx.fillStyle = '#2a2230'; ctx.font = '600 54px Title'; ctx.fillText('Strangers to Forever · character sheet v4 · anime', 50, 80);
  // full bodies
  hero3(ctx, 300, 1400, 1.25, CAST3.ishita, { t: .4, emo: 'happy', look: .3 });
  hero3(ctx, 760, 1400, 1.25, CAST3.vihaan, { t: 1.1, emo: 'happy', look: -.3 });
  ctx.font = '600 40px Title'; ctx.fillText('Ishita', 240, 1470); ctx.fillText('Vihaan', 690, 1470);
  // expression heads
  const exprs = [['neutral', 0], ['happy', 0], ['sad', 0], ['shocked', 0], ['blush', 0], ['talking', .8]];
  exprs.forEach(([e, talk], i) => {
    for (const [r, L, key] of [[0, CAST3.ishita, 'ishita'], [1, CAST3.vihaan, 'vihaan']]) {
      const x = 1150 + i * 205, y = 180 + r * 640;
      ctx.save(); ctx.beginPath(); ctx.roundRect(x - 95, y, 190, 270, 18); ctx.fillStyle = '#f0e9dc'; ctx.fill(); ctx.clip();
      hero3(ctx, x, y + 150 + 2.2 * 846 * (L.H / 960), 2.2, L, { t: 1.9, emo: e === 'talking' ? 'neutral' : e, talk, look: 0, pose: 'idle' });
      ctx.restore(); ctx.fillStyle = '#6b6470'; ctx.font = '28px system-ui'; ctx.fillText(e, x - 50, y + 305);
    }
  });
  return cv.toDataURL('image/png');
};
</script></body></html>
